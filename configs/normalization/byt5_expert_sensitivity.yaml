run:
  id: byt5_gold_v1_expert_sensitivity
  stage: expert_extended_sensitivity_only
  seed: 42
  input_path: data/aviation/processed/normalization_expert_sensitivity.parquet
  output_dir: outputs/normalization/models/byt5_gold_v1
  prediction_dir: outputs/normalization/predictions/byt5_gold_v1_expert_sensitivity
model:
  name_or_path: google/byt5-small
  max_source_length: 256
  max_target_length: 256
  num_beams: 4
training:
  per_device_eval_batch_size: 1
safety:
  evaluation_only: true
  never_use_for_model_selection: true
  interpretation: >-
    This population contains expert completions of truncated or anonymized
    source text. Scores measure agreement with the expert-expanded rendition,
    not recoverability of information absent from the source.


data:
  csv_path: data/Aircraft_Annotation_DataFile.csv
  problem_predictions_path: ../../../outputs/frozen/final_rq4_rq5/rq4_case_retrieval/problem_only_spert/predictions_problem_only.jsonl
  protocol_path: ../../../outputs/frozen/final_rq4_rq5/rq4_case_retrieval/protocol/split_v1.json
  frozen_kg_dir: ../../../outputs/frozen/final_operational_ie_kg/kg/aviation
extraction:
  mode: spert
  spert_url: http://127.0.0.1:8765
  require_problem_predictions: true
  allow_rule_fallback_for_dashboard: true
  live_query_case_adapter: ascii_uppercase
retrieval:
  default_mode: structure
  dense_model: ''
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_blend: 0.7
  rrf_k: 60
  weights:
    bm25: 0.34
    word: 0.24
    char: 0.14
    struct: 0.28
recommender:
  top_k: 25
  nearest_case_count: 8
  strong_min_clusters: 3
  moderate_min_clusters: 2
  strong_min_margin: 0.08
  moderate_min_margin: 0.03
  require_anchor_for_action: true
  abstain_on_single_cluster: false
  limited_min_coverage: 0.5
insights:
  recurring_min: 5
research:
  validated_candidate_split: train
  rq5_dev_predictions_path: ../../../outputs/frozen/final_rq4_rq5/rq4_case_retrieval/dev/predictions_structure.csv
  rq4_final_test_path: ../../../outputs/frozen/final_rq4_rq5/rq4_case_retrieval/test/RQ4_FINAL_TEST.json
  rq5_metrics_path: ../../../outputs/frozen/final_rq4_rq5/rq5_planning_support/RQ5_PLANNING_SUPPORT.json
  manual_review_path: ../../../outputs/frozen/final_rq4_rq5/rq4_case_retrieval/manual_review/MANUAL_REVIEW_RESULTS.json
  expected_corpus_rows: 6169
  expected_train_rows: 4319
normalization:
  enabled: true
  mode: byt5_guarded_deployment
  service_url: http://127.0.0.1:8766
  timeout_seconds: 45
  use_for_rq4: false
  use_for_rq5: false
  note: Operational guarded ByT5 deployment. It must not be described as identical
    to the frozen Selective-ByT5 policy unless the original selector is explicitly
    reused.
semantic_extraction:
  enabled: true
  mode: verified_normalized_semantic_spert_optional
  spert_url: http://127.0.0.1:8767
  representation: verified_normalized_operational_optional
  use_as_primary_diagnose_interpretation: true
  use_for_rq4: false
  use_for_rq5: false
  fallback_to_raw_spert: true
  weight_identity_source: runtime_model_lock.json
  frozen_operational_model_id: 1f9c094789f591991ad26ca65ca1c36689b57ff0dd248cd30b4fc81b853b4ad9
  activation: runtime_model_lock_verified_only
phase2:
  enabled: true
  max_subproblems: 4
  decomposition: relation_grounded_issue_on_item_has_location
  independent_retrieval_per_subproblem: true
  show_distinct_action_strategies: true
  invent_combined_action: false
  relax_primary_evidence_gate: false
  endpoint_identity: indexed_when_available_text_pair_fallback
phase3:
  enabled: true
  policy: graded_historical_evidence
  allow_single_cluster_primary: true
  limited_min_coverage: 0.5
  single_cluster_label: limited
  rq5_probability_used_as_gate: false
  limited_coverage_scope: selected_action_family
  raw_spert_required_for_primary_recommendation: true
api:
  enabled: true
  host: 127.0.0.1
  port: 8780
  docs: /docs
  frontend_ready: true
  cors_local_dev_ports:
  - 5173
  - 3000

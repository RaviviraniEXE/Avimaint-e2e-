# =============================================================================
# Configuration — Maintenance Work-Order Normalization (v2, Amin expert resources)
#
# Thesis: "Development and Evaluation of an NLP-Based Concept for Structured
#          Information Extraction and Planning Support in Maintenance Work Orders"
#
# Unit of processing: ONE combined text per record = PROBLEM + " " + ACTION,
# matching Amin's expert-cleaned gold. Systems A/B/C/D each normalize this.
# =============================================================================

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  outputs_dir: outputs

  logbook: data/raw/Aircraft_Annotation_DataFile.csv          # original truncated logbook
  # Amin expert resources (github.com/nadine-amin/Cleaned-MaintNet-...)
  expert_cleaned: data/raw/expert/cleaned_dataset.csv          # ID, PROBLEM, ACTION, CLEANED, EDIT
  expert_abbreviations: data/raw/expert/abbreviations.csv      # abbrev, expansion (100)
  expert_misspellings: data/raw/expert/misspellings.csv        # misspelling, correction (114)
  expert_unexpanded: data/raw/expert/unexpanded.csv            # keep-as-is abbreviations (26)

logbook:
  id_col: IDENT
  problem_col: PROBLEM
  action_col: ACTION

# -----------------------------------------------------------------------------
# Number convention.
#   digits (default, recommended for IE): "#2" -> "number 2", gold uses digits.
#   words  (match Amin/TTS exactly)     : "#2" -> "number two", gold as published.
# Switching this flips BOTH the gold (data/processed/gold_normalization.csv,
# rebuilt by 01_prepare_data.py) and System B's output, so they stay comparable.
# -----------------------------------------------------------------------------
numbers: digits

normalizer:
  fix_misspellings: true        # Amin's misspelling list (real-word/short sources filtered)
  expand_abbreviations: true    # Amin's abbreviation list (ambiguous keys skipped)
  expand_symbols: true          # # -> number, & -> and, " -> inches, * -> degrees ...
  keep_unexpanded: true         # Amin's 26 keep-as-is abbreviations (CHT, EGT, PSI ...)
  lowercase: true
  emit_alignment: true          # token-level alignment for IE projection

dictionary:
  # Misspelling sources that are ALSO valid words / too short are dangerous to
  # apply globally (e.g. OFF->OF, THAT->THAN). These are skipped and logged.
  misspelling_min_len: 3
  misspelling_blocklist: ["off", "that", "affect", "sam", "same", "no", "on", "in", "by"]

evaluation:
  gold_file: data/processed/gold_normalization.csv
  gold_train_file: data/processed/gold_train.csv
  gold_dev_file: data/processed/gold_dev.csv
  gold_test_file: data/processed/gold_test.csv
  split: {train: 0.7, dev: 0.15, test: 0.15}
  report_dir: outputs/reports
  results_log: outputs/reports/results_log.csv     # every run appended here

byt5:
  model_name: google/byt5-small
  max_source_length: 128
  max_target_length: 128
  train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  num_epochs: 5
  # NOTE: never use fp16 for ByT5/T5 — it overflows to NaN loss. Use bf16
  # (supported on RTX 3050 / Ampere) or fall back to fp32.
  fp16: false
  bf16: true
  gradient_checkpointing: true
  seed: 42

seed: 42
